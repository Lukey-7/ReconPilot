[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconpilot"
version = "0.1.0"
description = "Daily fund reconciliation, break triage and NAV checks for fund operations teams."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgserver>=0.1.4",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
reconpilot = "reconpilot.cli:main"
reconpilot-web = "reconpilot_web.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reconpilot", "src/reconpilot_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
