# Alembic configuration for the ReconPilot web database.
#
# Usually you run migrations with `reconpilot-web migrate`, which also records
# the instance mode. This file lets the plain `alembic` command work too; the
# database URL comes from RP_MIGRATION_DATABASE_URL (or RP_DATABASE_URL).

[alembic]
script_location = %(here)s/src/reconpilot_web/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
